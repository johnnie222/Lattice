name: Android APK

on:
  push:
    branches: [main, ccr-4133364a-pl4gjz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build the app bundle and copy it into the Android project
        run: |
          npm run build:mobile
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../lattice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lattice-apk
          path: lattice.apk

      # A fixed release tag gives the latest APK a stable download link.
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Lattice for Android (latest build)
          body: |
            Latest Android build from `${{ github.ref_name }}` at ${{ github.sha }}.
            Download `lattice.apk` on your phone and open it to install.
          prerelease: true
          files: lattice.apk
